<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b5d">
  <title>You're offline | AI Road Guardian</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f8fc; color: #1f2937; font: 16px/1.6 Arial, sans-serif; }
    main { width: min(100%, 520px); padding: 36px; border: 1px solid #d9e4ee; border-radius: 20px; background: #fff; box-shadow: 0 18px 48px #112d3e17; text-align: center; }
    .icon { display: grid; width: 68px; height: 68px; margin: 0 auto 20px; place-items: center; border-radius: 50%; background: #e8f4f8; font-size: 32px; }
    h1 { margin: 0 0 12px; color: #123b5d; font-size: clamp(25px, 6vw, 34px); }
    p { margin: 0 0 24px; color: #62717d; }
    button, a { display: inline-block; padding: 12px 18px; border: 0; border-radius: 9px; background: #123b5d; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    a { margin-left: 8px; background: #e8f4f8; color: #123b5d; }
    @media (max-width: 420px) { main { padding: 28px 20px; } a { margin: 10px 0 0; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You’re offline</h1>
    <p>AI Road Guardian can’t connect right now. Check your internet connection and try again. Your reports and account data are not available offline.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <a href="/">Home</a>
  </main>
</body>
</html>
