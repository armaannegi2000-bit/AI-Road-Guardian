<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8fc">
  <title>Page not found | AI Road Guardian</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='site-theme.css') }}">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #f4f8fc; color: #1f2937; font: 16px/1.6 Arial, sans-serif; }
    main { width: min(100%, 520px); padding: 36px; border: 1px solid #d9e4ee; border-radius: 20px; background: #fff; box-shadow: 0 18px 48px #112d3e17; text-align: center; }
    .code { margin: 0; color: #1976d2; font-size: 64px; font-weight: 800; line-height: 1; }
    h1 { margin: 16px 0 8px; color: #123b5d; }
    p { margin: 0 0 24px; color: #62717d; }
    a { display: inline-block; padding: 12px 18px; border-radius: 9px; background: #123b5d; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>That page may have moved or the address may be incorrect.</p>
    <a href="{{ url_for('home') }}">Return to Home</a>
  </main>
</body>
</html>
