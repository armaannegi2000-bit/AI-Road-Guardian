<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineer Login | AI Road Guardian</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e8f4f8,#d9eaf7);color:#18334a}.card{width:min(100%,440px);background:#fff;padding:34px;border-radius:16px;box-shadow:0 10px 32px #123b5d20}h1{margin:0 0 8px;color:#123b5d}p{color:#607384;line-height:1.5}.role{font-size:14px;margin:0 0 25px}label{display:block;margin:16px 0 7px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #b8c2cc;border-radius:8px;font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#123b5d;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.error{padding:11px;background:#fff1f0;border-radius:8px;color:#b42318}.links{display:flex;justify-content:space-between;margin-top:22px}.links a{color:#145b88;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>👷 Engineer Login</h1>
    <p class="role">AI Road Guardian · Engineer Dashboard</p>
    <p>Login using the individual account created for you by the government.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form action="/engineer-auth" method="POST">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Login to Engineer Dashboard</button>
    </form>
    <nav class="links"><a href="/">← Home</a>
  </main>
</body>
</html>
