<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report a Road Problem | AI Road Guardian</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background:
            linear-gradient(
                135deg,
                #e8f4f8,
                #d9eaf7
            );

            min-height: 100vh;

            padding: 40px 15px;
        }

        .container {

            max-width: 700px;

            margin: auto;

            background-color: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
            0 8px 25px
            rgba(0, 0, 0, 0.15);
        }

        h1 {

            text-align: center;

            color: #123b5d;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

            line-height: 1.5;
        }

        label {

            display: block;

            font-weight: bold;

            color: #333;

            margin-top: 18px;

            margin-bottom: 8px;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 13px;

            border:
            1px solid #b8c2cc;

            border-radius: 8px;

            font-size: 16px;
        }

        textarea {

            resize: vertical;
        }

        .location-box {

            background-color: #eef8f5;

            padding: 15px;

            border-radius: 10px;

            margin-top: 18px;
        }

        .location-box p {

            margin-bottom: 10px;
        }

        .location-button {

            padding: 10px 15px;

            background-color: #167a67;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;
        }

        .submit-button {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            background-color: #0b5d8c;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .submit-button:hover {

            background-color: #08476b;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #123b5d;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        🛣️ Report a Road Problem
    </h1>

    <p class="subtitle">

        Upload a photo, share the location,
        and help authorities identify
        road damage faster.

    </p>


    <!-- IMPORTANT:
         enctype allows the image file
         to be sent to Flask.
    -->

    <form
        action="/submit-report"
        method="POST"
        enctype="multipart/form-data"
    >


        <!-- Road Photo -->

        <label for="photo">
            Upload Road Photo
        </label>

        <input
            type="file"
            id="photo"
            name="photo"
            accept="image/*"
            required
        >


        <!-- Problem Type -->

        <label for="problem">
            Type of Road Problem
        </label>

        <select
            id="problem"
            name="problem"
            required
        >

            <option value="">
                Select a problem
            </option>

            <option value="Pothole">
                Pothole
            </option>

            <option value="Cracked Road">
                Cracked Road
            </option>

            <option value="Waterlogging">
                Waterlogging
            </option>

            <option value="Damaged Road Surface">
                Damaged Road Surface
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <!-- Location -->

        <div class="location-box">

            <p>
                📍 Location
            </p>

            <button
                type="button"
                class="location-button"
                onclick="getLocation()"
            >
                Use My Current Location
            </button>

            <p id="locationText">
                Location not selected
            </p>

            <input
                type="hidden"
                id="location"
                name="location"
            >

        </div>


        <!-- Description -->

        <label for="description">
            Describe the Problem
        </label>

        <textarea
            id="description"
            name="description"
            rows="5"
            placeholder="Example: A large pothole is causing traffic problems..."
            required
        ></textarea>


        <!-- Submit -->

        <button
            type="submit"
            class="submit-button"
        >
            Submit Report for AI Analysis
        </button>

    </form>


    <a
        class="back"
        href="/"
    >
        ← Back to Home
    </a>

</div>


<script>

function getLocation() {

    const locationText =
        document.getElementById("locationText");

    const locationInput =
        document.getElementById("location");


    if (!navigator.geolocation) {

        locationText.textContent =
            "Geolocation is not supported.";

        return;
    }


    locationText.textContent =
        "Getting your location...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            locationInput.value =
                latitude + "," + longitude;


            locationText.textContent =
                "Location selected: "
                + latitude
                + ", "
                + longitude;
        },


        function() {

            locationText.textContent =
                "Unable to get location.";

        }

    );

}

</script>


</body>

</html>
