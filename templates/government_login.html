<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Government Login | AI Road Guardian</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #123b5d,
        #1976d2
    );

}


.login-card{

    width:90%;
    max-width:420px;

    background:white;

    padding:35px;

    border-radius:18px;

    box-shadow:
    0 12px 35px rgba(0,0,0,0.25);

}


h1{

    text-align:center;

    color:#123b5d;

}


.subtitle{

    text-align:center;

    color:#64748b;

    margin-bottom:25px;

}


label{

    display:block;

    margin-top:15px;

    margin-bottom:7px;

    font-weight:bold;

}


input{

    width:100%;

    padding:13px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    font-size:16px;

}


button{

    width:100%;

    margin-top:25px;

    padding:14px;

    border:none;

    border-radius:8px;

    background:#1976d2;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


button:disabled{

    opacity:0.7;

}


.message{

    display:none;

    margin-top:20px;

    padding:12px;

    text-align:center;

    border-radius:8px;

    font-weight:bold;

}


.success{

    display:block;

    background:#dcfce7;

    color:#166534;

}


.error{

    display:block;

    background:#fee2e2;

    color:#b91c1c;

}


.demo-note{

    margin-top:20px;

    padding:12px;

    background:#fff7ed;

    border-radius:8px;

    color:#9a3412;

    font-size:13px;

}


.home-link{

    display:block;

    text-align:center;

    margin-top:20px;

    text-decoration:none;

    color:#123b5d;

    font-weight:bold;

}

</style>

</head>


<body>


<div class="login-card">


<h1>
🛣️ Government Login
</h1>


<p class="subtitle">
Authorized officers and engineers only
</p>



<form id="loginForm">


<label>
Government Email
</label>


<input
id="email"
type="email"
name="username"
placeholder="officer@government.in"
required>



<label>
Password
</label>


<input
id="password"
type="password"
name="password"
placeholder="Enter password"
required>



<button id="loginBtn" type="submit">

Login to Dashboard

</button>


</form>



<div id="message" class="message"></div>



<div class="demo-note">

<strong>Demo login:</strong>

<br>

Email: officer@government.in

<br>

Password: road123

</div>



<a href="/" class="home-link">

← Back to Home

</a>


</div>




<script>


const form =
document.getElementById("loginForm");


const btn =
document.getElementById("loginBtn");


const message =
document.getElementById("message");



form.addEventListener(
"submit",
async function(e){


e.preventDefault();



btn.innerHTML =
"🔄 Verifying credentials...";


btn.disabled = true;



let formData =
new FormData(form);



let response =
await fetch(
"/government-auth",
{
method:"POST",
body:formData
}
);



let data =
await response.json();



if(data.success){


message.style.display="block";

message.className =
"message success";


message.innerHTML =
"✅ Login successful! Opening dashboard...";



setTimeout(
function(){

window.location.href="/dashboard";

},
1000
);



}

else{


message.style.display="block";

message.className =
"message error";


message.innerHTML =
"❌ Incorrect email or password.";


btn.innerHTML =
"Login to Dashboard";


btn.disabled=false;


}



});

</script>


</body>

</html>
