<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Government Login | AI Road Guardian
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #123b5d,
                    #1976d2
                );
        }

        .login-card {
            width: 90%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;

            color: #123b5d;

            text-align: center;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-bottom: 28px;
        }

        label {
            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 16px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #1976d2;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            display: none;

            margin-top: 20px;

            padding: 12px;

            text-align: center;

            border-radius: 8px;
        }

        .success {
            background: #dcfce7;

            color: #166534;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;
        }

        .home-link {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #123b5d;

            text-decoration: none;

            font-weight: bold;
        }

        .demo-note {
            margin-top: 20px;

            padding: 12px;

            background: #fff7ed;

            border-radius: 8px;

            font-size: 13px;

            color: #9a3412;
        }

    </style>

</head>

<body>

<div class="login-card">

    <h1>
        🛣️ Government Login
    </h1>

    <p class="subtitle">
        Authorized officers and engineers only
    </p>

    <form id="loginForm">

        <label>
            Government Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="officer@government.in"
            required>


        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Enter password"
            required>


        <button type="submit">

            Login to Dashboard

        </button>

    </form>


    <div
        id="message"
        class="message">

    </div>


    <div class="demo-note">

        <strong>
            Demo login:
        </strong>

        <br>

        Email:
        officer@government.in

        <br>

        Password:
        road123

    </div>


    <a
        href="/"
        class="home-link">

        ← Back to Home

    </a>

</div>


<script>

document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            const email =
                document
                .getElementById(
                    "email"
                )
                .value;

            const password =
                document
                .getElementById(
                    "password"
                )
                .value;

            const message =
                document
                .getElementById(
                    "message"
                );

            if (
                email ===
                "officer@government.in"
                &&
                password ===
                "road123"
            ) {

                message
                .style
                .display = "block";

                message
                .className =
                "message success";

                message
                .innerText =
                "Login successful! Opening dashboard...";

                setTimeout(
                    function() {

                        window.location.href =
                        "/dashboard";

                    },
                    1000
                );

            } else {

                message
                .style
                .display = "block";

                message
                .className =
                "message error";

                message
                .innerText =
                "Incorrect email or password.";

            }

        }
    );

</script>

</body>

</html>
